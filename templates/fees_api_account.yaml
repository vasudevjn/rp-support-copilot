templates:
  invoice_available:
    action: auto_resolve
    en: "GST invoices for fees are generated by the 5th of every month. You can download them under Dashboard > Reports > Invoices."
    hi: "Fees ke GST invoices har mahine ki 5th tak generate ho jaate hain. Aap inhe Dashboard > Reports > Invoices se download kar sakte hain."

  invoice_unavailable_escalate:
    action: escalate
    en: "Thank you for letting us know. We have asked your Account Manager to look into the GST invoice on your account."
    hi: "Batane ke liye dhanyavaad. Humne aapke Account Manager ko aapke account ke GST invoice ki jaanch karne ko kaha hai."

  fee_commercial_escalate:
    action: escalate
    en: "Thank you for sharing this. Pricing and fee requests are handled by your Account Manager, so we have passed your request to them for review."
    hi: "Yeh share karne ke liye dhanyavaad. Pricing aur fees ki requests aapke Account Manager handle karte hain, isliye humne aapki request review ke liye unhe bhej di hai."

  api_signature:
    action: auto_resolve
    en: "SIGNATURE_MISMATCH means the signature check is not matching. Please verify the signature using your key secret on the string 'order_id|payment_id' (order ID, a pipe, then payment ID)."
    hi: "SIGNATURE_MISMATCH ka matlab hai signature check match nahi ho raha. Kripya apne key secret se 'order_id|payment_id' string (order ID, pipe, phir payment ID) par signature verify karein."

  api_amount_mismatch:
    action: auto_resolve
    en: "This BAD_REQUEST_ERROR happens when the amount is not in paise. Amounts must be sent in paise, so Rs 499 should be sent as 49900."
    hi: "Yeh BAD_REQUEST_ERROR tab aata hai jab amount paise me nahi hota. Amount paise me bhejna hota hai, toh Rs 499 ko 49900 bhejein."

  api_auth_failed:
    action: auto_resolve
    en: "'Authentication failed' on a live site usually means test keys are being used in production. Please use the live key ID and secret generated after activation."
    hi: "Live site par 'Authentication failed' ka matlab aam taur par yeh hai ki production me test keys use ho rahi hain. Kripya activation ke baad generate hui live key ID aur secret use karein."

  api_webhook:
    action: auto_resolve
    en: "If webhooks are not received, please check that the URL is publicly reachable, returns HTTP 200 within 5 seconds, and that the event is subscribed. Failed webhooks are retried for up to 24 hours."
    hi: "Agar webhooks nahi aa rahe, toh kripya check karein ki URL publicly reachable hai, 5 seconds ke andar HTTP 200 return karta hai, aur event subscribed hai. Failed webhooks 24 hours tak retry hote hain."

  api_no_kb_escalate:
    action: escalate
    en: "Thank you for the details. We have passed this to our Tech Support team, who are investigating it."
    hi: "Details ke liye dhanyavaad. Humne ise hamari Tech Support team ko bhej diya hai, jo iski jaanch kar rahi hai."

  api_no_kb_escalate_production:
    action: escalate
    en: "Thank you for the details. Since this affects your production traffic, we have passed it to our Tech Support team, who are investigating it."
    hi: "Details ke liye dhanyavaad. Kyunki yeh aapke production traffic par asar daal raha hai, humne ise hamari Tech Support team ko bhej diya hai, jo iski jaanch kar rahi hai."

  account_change_contact:
    action: auto_resolve
    en: "You can change your registered email and mobile number under Settings, using OTP verification."
    hi: "Aap apna registered email aur mobile number Settings me OTP verification ke saath change kar sakte hain."

  account_change_legal_name:
    action: auto_resolve
    en: "A change of legal entity name or business type cannot be done by editing the account. It needs a fresh application."
    hi: "Legal entity ka naam ya business type edit karke change nahi ho sakta. Iske liye nayi (fresh) application deni hogi."

  account_closure_escalate:
    action: escalate
    en: "We have received your request to close the account. Closure is processed only after all pending settlements, refunds and disputes are cleared, and is handled by your Account Manager. We have shared your request with them."
    hi: "Account band karne ki aapki request mil gayi hai. Closure tabhi process hota hai jab saare pending settlements, refunds aur disputes clear ho jaate hain, aur yeh aapke Account Manager handle karte hain. Humne aapki request unhe bhej di hai."
